name: Main

on:
  push:
    branches: ["main"]

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build
  build:
    if: github.repository == 'SundaeSwap-finance/sundae-sdk'
    permissions:
      id-token: write
      contents: write
      pages: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: actions/setup-node@v3
        with:
          node-version: 22

      # Install dependencies
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      # Build dist folders
      - name: Build
        run: bun run build

      # Run Tests
      - name: Run Tests
        run: bun test

      # npm >= 11.5.1 performs the OIDC token exchange for trusted
      # publishing; node 22's bundled npm 10 does not.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      # Publishes via npm trusted publishing (OIDC): the job's
      # `id-token: write` permission lets npm mint a workload credential
      # scoped to this repo + workflow file — no long-lived registry token.
      # Each published package names this workflow as its Trusted Publisher
      # on npmjs.com; a package without that configuration fails to publish.
      # `changeset publish` skips versions the registry already has, so
      # re-running after a partial failure is safe.
      - name: Release
        uses: changesets/action@v1
        with:
          publish: bun publish:ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy Documentation
  docs:
    if: github.repository == 'SundaeSwap-finance/sundae-sdk'
    permissions:
      id-token: write
      pages: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build Documentation Site
      - name: Setup Pages
        uses: actions/configure-pages@v2
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
